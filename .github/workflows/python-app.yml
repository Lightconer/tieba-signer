name: Tieba Sign

on:
  schedule:
    - cron: '0 0 * * *'  # UTC时间每天0点（北京时间8点）
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 schedule
        
    - name: Run sign script
      env:
        BDUSS: ${{ secrets.BDUSS }}
      run: python tieba_signer.py
